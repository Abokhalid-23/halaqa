<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>أوراد حلقة الجليل</title>

<style>
/* Layout: one column notebook; top bar with logo and two role tabs; teacher view has its own sub-tabs (record, circle summary, admin) */
:root{
  --bg:#F2F6F7; --surface:#FFFFFF; --sunk:#E5ECEE; --line:#D2DDE0;
  --fg:#18282D; --muted:#5A6D73;
  --accent:#0A7F96; --accent-ink:#FFFFFF; --accent-soft:#D8EEF2;
  --gold:#9C7A22; --gold-soft:#F3EAD2;
  --good:#2E7D4F; --warn:#B26A00; --bad:#B23A3A; --bad-soft:#F6E0DE;
  --display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10181B; --surface:#172226; --sunk:#1F2C31; --line:#2C3B41;
  --fg:#E2ECEF; --muted:#97AAB0;
  --accent:#3CBCD4; --accent-ink:#0A1A1E; --accent-soft:#163A43;
  --gold:#D6AE52; --gold-soft:#372E1C;
  --good:#5CC48A; --warn:#E3A24A; --bad:#E57373; --bad-soft:#3D2423;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10181B; --surface:#172226; --sunk:#1F2C31; --line:#2C3B41;
  --fg:#E2ECEF; --muted:#97AAB0;
  --accent:#3CBCD4; --accent-ink:#0A1A1E; --accent-soft:#163A43;
  --gold:#D6AE52; --gold-soft:#372E1C;
  --good:#5CC48A; --warn:#E3A24A; --bad:#E57373; --bad-soft:#3D2423;
  color-scheme:dark}
*{box-sizing:border-box}
html{direction:rtl}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 14px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:64px;height:64px;flex:none}
.brand h1{font-family:var(--display);font-weight:700;font-size:1.6rem;margin:0;line-height:1.2;color:var(--accent)}
.brand p{margin:2px 0 0;color:var(--gold);font-size:.85rem;font-weight:600}
.tabs{display:flex;background:var(--sunk);border-radius:999px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;color:var(--muted);font:600 .95rem var(--body);padding:8px 20px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.subtabs button{border:0;background:none;padding:8px 12px;font:600 .92rem var(--body);color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.subtabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.demo{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--gold-soft);color:var(--fg);border-radius:var(--r);padding:10px 14px;font-size:.88rem;margin-bottom:16px}
.demo b{color:var(--gold)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:.08em;direction:ltr;unicode-bidi:isolate}
button,input,select,textarea{font-family:var(--body);font-size:.95rem;color:var(--fg)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.small{padding:4px 10px;font-size:.82rem}
.link{background:none;border:0;color:var(--accent);cursor:pointer;font-weight:600;padding:0;text-decoration:underline;font-size:inherit}
select,input[type=text],input[type=password],input[type=number],input[type=date],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
textarea{width:100%;resize:vertical;min-height:2.6em}
.lbl{display:block;font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.02em;margin-bottom:4px}
h2{font-family:var(--display);font-weight:500;font-size:1.2rem;margin:0 0 10px;text-wrap:balance}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.between{justify-content:space-between;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
.chip[aria-pressed="true"] .dot{background:var(--accent-ink)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:6px 12px;font-size:.88rem;font-weight:600;color:var(--muted);border-inline-start:1px solid var(--line)}
.seg label:first-child span{border-inline-start:0}
.seg input:checked+span{background:var(--accent-soft);color:var(--accent)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:-2px}
.seg.ded input:checked+span.ded-on{background:var(--bad-soft);color:var(--bad)}
.group-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:4px}
.group-h h3{font-family:var(--display);font-weight:500;font-size:1.08rem;margin:0}
.group-h .muted{font-size:.8rem}
.ward{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ward-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--sunk)}
.ward-head .tag{font-family:var(--display);font-size:1rem}
.ward-body{padding:12px;display:grid;grid-template-columns:minmax(0,1fr) 8.5em;gap:10px;align-items:start}
@media (max-width:520px){.ward-body{grid-template-columns:minmax(0,1fr)}}
.ward.off .ward-body{opacity:.4}
.ward.next{border-style:dashed}
.ward.next .ward-body{grid-template-columns:minmax(0,1fr)}
.rng{display:grid;grid-template-columns:2.2em minmax(0,1fr) 4.6em;gap:6px;align-items:center;margin-bottom:6px}
.rng span{font-size:.82rem;color:var(--muted)}
.rng select,.rng input{width:100%}
.rng input{text-align:center}
.count{font-size:.8rem;color:var(--accent);font-weight:700}
.toggle{display:inline-flex;gap:6px;align-items:center;font-size:.85rem;font-weight:600;cursor:pointer}
.tag.new{color:var(--accent)} .tag.minor{color:var(--gold)} .tag.major{color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:620px){.stats.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--sunk);border-radius:10px;padding:10px;min-width:0}
.stat .v{font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .v small{font-size:.75rem;color:var(--muted);font-weight:600}
.stat .k{font-size:.76rem;color:var(--muted);font-weight:600}
.stat.wide{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft)}
.stat.wide .v{color:var(--accent)}
.stat.hero{background:var(--accent);color:var(--accent-ink)}
.stat.hero .k,.stat.hero .v small{color:var(--accent-ink);opacity:.85}
.parts{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.parts .p{display:grid;grid-template-columns:7.5em minmax(0,1fr) 3.2em;gap:8px;align-items:center;font-size:.82rem}
.parts .bar{height:7px;background:var(--sunk);border-radius:4px;overflow:hidden}
.parts .bar i{display:block;height:100%;background:var(--accent)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{font-size:.75rem;color:var(--muted);text-align:start;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:center}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
.pill{display:inline-block;font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.p{background:var(--accent-soft);color:var(--good)}
.pill.l{background:var(--gold-soft);color:var(--warn)}
.pill.a{background:var(--bad-soft);color:var(--bad)}
.ded{color:var(--bad);font-size:.78rem;font-weight:600}
.hist{display:flex;flex-direction:column;gap:8px;max-height:380px;overflow:auto}
.hist .h{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.85rem}
.hist .h .top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:3px}
.hist .wline{color:var(--muted)}
.hist .wline b{color:var(--fg);font-weight:600}
.lb{display:flex;flex-direction:column;gap:6px}
.lb .it{display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid var(--line)}
.lb .it.me{border-color:var(--accent);background:var(--accent-soft)}
.lb .rk{font-family:var(--display);font-size:1.15rem;text-align:center;color:var(--muted)}
.lb .it:nth-child(1) .rk{color:var(--gold)}
.lb .nm{font-weight:700}
.lb .bar{height:6px;background:var(--sunk);border-radius:3px;margin-top:4px;overflow:hidden}
.lb .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.lb .pts{font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
.lb .pts small{display:block;font-size:.7rem;color:var(--muted);font-weight:600}
.next3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:680px){.next3{grid-template-columns:minmax(0,1fr)}}
.nc{border-radius:12px;padding:12px;border:1px solid var(--line);background:var(--surface)}
.nc .t{font-family:var(--display);font-size:1rem}
.nc .r{font-size:1.05rem;font-weight:700;margin-top:4px}
.nc[data-t="new"]{border-top:4px solid var(--accent)} .nc[data-t="new"] .t{color:var(--accent)}
.nc[data-t="minor"]{border-top:4px solid var(--gold)} .nc[data-t="minor"] .t{color:var(--gold)}
.nc[data-t="major"]{border-top:4px solid var(--warn)} .nc[data-t="major"] .t{color:var(--warn)}
.login{max-width:380px;margin:24px auto;text-align:center}
.login img{width:96px;height:96px;margin:0 auto}
.login input{font-size:1.4rem;text-align:center;letter-spacing:.2em;width:100%;padding:10px;text-transform:uppercase}
.err{color:var(--bad);font-size:.85rem;min-height:1.4em}
.sync{font-size:.82rem;font-weight:600;border-radius:999px;padding:6px 14px;margin-bottom:12px;background:var(--sunk);color:var(--muted);width:fit-content;max-width:100%}
.sync.ok{background:var(--accent-soft);color:var(--good)}
.sync.warn{background:var(--gold-soft);color:var(--warn)}
.toast{position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:calc(100% - 32px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.confirm{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

</head>

<script>
// ===== Quran data: [name, ayah count] =====
const SURAH=[["الفاتحة",7],["البقرة",286],["آل عمران",200],["النساء",176],["المائدة",120],["الأنعام",165],["الأعراف",206],["الأنفال",75],["التوبة",129],["يونس",109],["هود",123],["يوسف",111],["الرعد",43],["إبراهيم",52],["الحجر",99],["النحل",128],["الإسراء",111],["الكهف",110],["مريم",98],["طه",135],["الأنبياء",112],["الحج",78],["المؤمنون",118],["النور",64],["الفرقان",77],["الشعراء",227],["النمل",93],["القصص",88],["العنكبوت",69],["الروم",60],["لقمان",34],["السجدة",30],["الأحزاب",73],["سبأ",54],["فاطر",45],["يس",83],["الصافات",182],["ص",88],["الزمر",75],["غافر",85],["فصلت",54],["الشورى",53],["الزخرف",89],["الدخان",59],["الجاثية",37],["الأحقاف",35],["محمد",38],["الفتح",29],["الحجرات",18],["ق",45],["الذاريات",60],["الطور",49],["النجم",62],["القمر",55],["الرحمن",78],["الواقعة",96],["الحديد",29],["المجادلة",22],["الحشر",24],["الممتحنة",13],["الصف",14],["الجمعة",11],["المنافقون",11],["التغابن",18],["الطلاق",12],["التحريم",12],["الملك",30],["القلم",52],["الحاقة",52],["المعارج",44],["نوح",28],["الجن",28],["المزمل",20],["المدثر",56],["القيامة",40],["الإنسان",31],["المرسلات",50],["النبأ",40],["النازعات",46],["عبس",42],["التكوير",29],["الانفطار",19],["المطففين",36],["الانشقاق",25],["البروج",22],["الطارق",17],["الأعلى",19],["الغاشية",26],["الفجر",30],["البلد",20],["الشمس",15],["الليل",21],["الضحى",11],["الشرح",8],["التين",8],["العلق",19],["القدر",5],["البينة",8],["الزلزلة",8],["العاديات",11],["القارعة",11],["التكاثر",8],["العصر",3],["الهمزة",9],["الفيل",5],["قريش",4],["الماعون",7],["الكوثر",3],["الكافرون",6],["النصر",3],["المسد",5],["الإخلاص",4],["الفلق",5],["الناس",6]];
const CUM=[0];SURAH.forEach((x,i)=>CUM.push(CUM[i]+x[1]));
const aIdx=(s,a)=>CUM[s-1]+a;
const ayahs=r=>r?Math.abs(aIdx(r.to[0],r.to[1])-aIdx(r.from[0],r.from[1]))+1:0;
const sName=s=>SURAH[s-1][0];
const sLen=s=>SURAH[s-1][1];
function fmtRange(r){
  if(!r)return "—";
  const [fs,fa]=r.from,[ts,ta]=r.to;
  if(fs===ts)return (fa===1&&ta===sLen(fs))?`سورة ${sName(fs)} كاملة`:`${sName(fs)} ${fa}–${ta}`;
  return `${sName(fs)} ${fa} إلى ${sName(ts)} ${ta}`;
}
// Suggest the next new-memorization portion: continue in the same surah, else move to the neighbouring surah
// (backwards for juz amma and the short surahs, forwards otherwise), keeping the same length.
function continueFrom(r){
  if(!r)return null;const k=Math.max(1,Math.min(ayahs(r),20));const [s,a]=r.to;
  if(a<sLen(s))return{from:[s,a+1],to:[s,Math.min(sLen(s),a+k)]};
  const ns=s>=78?s-1:s+1;if(ns<1||ns>114)return null;
  return{from:[ns,1],to:[ns,Math.min(sLen(ns),k)]};
}

// ===== Daily points: 10 = attendance 2 + new memorization 2 + review 2 + adab & uniform 2 + participation 2 =====
const TYPES=[["new","الحفظ الجديد"],["minor","المراجعة الصغرى"],["major","المراجعة الكبرى"]];
const GRADES=[[5,"ممتاز",1],[4,"جيد جداً",.75],[3,"جيد",.5],[2,"مقبول",.25],[0,"يعاد",0]];
const GNAME=Object.fromEntries(GRADES.map(g=>[g[0],g[1]]));
const GF=Object.fromEntries(GRADES.map(g=>[g[0],g[2]]));
const ATT=[["p","حاضر",2],["l","متأخر",1],["e","مستأذن",2],["a","غائب",0]];
const ANAME=Object.fromEntries(ATT.map(a=>[a[0],a[1]]));
const APTS=Object.fromEntries(ATT.map(a=>[a[0],a[2]]));
const DEDS=[0,.5,1];
const PART=[[2,"ممتازة"],[1,"متوسطة"],[0,"ضعيفة"]];
const PARTS=[["att","الحضور"],["nw","الحفظ الجديد"],["rev","المراجعة"],["beh","الأدب والزي"],["part","المشاركة"]];
const r1=n=>Math.round(n*10)/10;
const isIn=s=>s.att==="p"||s.att==="l";
function sesParts(s){
  const o={att:APTS[s.att]||0,nw:0,rev:0,beh:0,part:0};
  if(isIn(s)){
    if(s.wards.new)o.nw=2*GF[s.wards.new.grade];
    const rv=["minor","major"].map(t=>s.wards[t]).filter(Boolean);
    if(rv.length)o.rev=2*rv.reduce((a,w)=>a+GF[w.grade],0)/rv.length;
    o.beh=Math.max(0,2-(s.adab||0)-(s.uniform||0));
    o.part=s.part??2;
  }
  o.bonus=+s.bonus||0;
  o.total=o.att+o.nw+o.rev+o.beh+o.part+o.bonus;return o;
}
const sesPoints=s=>r1(sesParts(s).total);

// ===== Server (Google Apps Script) =====
let DB=null,TDB=null,SDB=null,PIN=null;
const pref=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){return null}};
PIN=pref("halaqa-pin");
const EXEC="https://script.google.com/macros/s/AKfycbxQeArqfR3RB0OIKTCBTgwwnYE8FJ9awnppoywmMHhcU1bf7--jiAlDckuRuP4oZ3Di/exec";
// Inside Apps Script use google.script.run; on the standalone page call the same functions through doPost.
const api=(fn,...args)=>{
  if(window.google?.script?.run)return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
  const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),25000);
  return fetch(EXEC,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,args}),signal:ctl.signal})
    .then(r=>r.json()).then(d=>{if(d.err)throw new Error(d.err);return d.ok}).finally(()=>clearTimeout(tm));
};
const LOGIC_ERR=/رمز المعلم|الطالب غير|الرمز 4|الحلقة|unknown call/;
const isAuthErr=e=>/رمز المعلم/.test(String(e&&e.message||e));
const errMsg=e=>{const m=String((e&&e.message)||e||"");if(LOGIC_ERR.test(m))return m.replace(/^.*?Error:\s*/,"");return "لا يوجد اتصال بالخادم. تأكد من الإنترنت وحاول مرة أخرى."};
function loadingHTML(t){return `<section class="panel" style="text-align:center;padding:40px 16px"><p class="muted" style="margin:0">${t||"جارٍ تحميل البيانات…"}</p></section>`}

// ===== Offline: data cached on the device, changes queued and uploaded when the connection returns =====
const jget=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const jset=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let OUTBOX=jget("halaqa-outbox",[]),SYNCING=false,NET=navigator.onLine!==false;
const cacheT=()=>{if(TDB)jset("halaqa-tdb",TDB)};
function queue(fn,...args){OUTBOX.push({fn,args});jset("halaqa-outbox",OUTBOX);cacheT();syncBar();flush()}
async function flush(){
  if(SYNCING||!OUTBOX.length||!PIN)return;
  SYNCING=true;syncBar();
  try{
    while(OUTBOX.length){
      const op=OUTBOX[0];
      try{await api(op.fn,PIN,...op.args)}
      catch(e){if(isAuthErr(e)||!LOGIC_ERR.test(String(e&&e.message||e)))throw e;toast("لم تُرفع عملية: "+errMsg(e))}
      OUTBOX.shift();jset("halaqa-outbox",OUTBOX);NET=true;syncBar();
    }
    refreshTeacher();
  }catch(e){NET=false;if(isAuthErr(e))toast("رمز المعلم تغيّر. سجّل الدخول من جديد لرفع التسجيلات المحفوظة.")}
  finally{SYNCING=false;syncBar()}
}
async function refreshTeacher(){
  try{const d=await api("teacherData",PIN);NET=true;if(OUTBOX.length)return;TDB=d;cacheT();pref("halaqa-tsync",new Date().toISOString());if(VIEW==="teacher"&&!formDirty())render()}
  catch(e){NET=false}finally{syncBar()}
}
// don't wipe a half-filled form when fresh data arrives in the background
let DIRTY=false;const formDirty=()=>DIRTY&&!!$("#form");
function syncBar(){
  const el=$("#sync");if(!el)return;
  const n=OUTBOX.length;let cls="",txt="";
  if(VIEW==="teacher"&&PIN){
    if(SYNCING)txt="جارٍ رفع التسجيلات…";
    else if(n)cls="warn",txt=`${n===1?"تسجيل واحد محفوظ":n===2?"تسجيلان محفوظان":n+" تسجيلات محفوظة"} على الجهاز، تُرفع عند توفر النت`;
    else if(!NET)cls="warn",txt="بدون إنترنت · التسجيل يعمل ويُحفظ على الجهاز";
    else cls="ok",txt="متصل · كل التسجيلات مرفوعة";
  }else if(VIEW==="student"&&SDB&&!NET){cls="warn";const t=pref("halaqa-ssync");txt="بدون إنترنت · تعرض آخر بيانات محفوظة"+(t?` (${fmtTime(t)})`:"")}
  el.className="sync "+cls;el.textContent=txt;el.hidden=!txt;
}
const fmtTime=iso=>{try{return new Date(iso).toLocaleString("ar",{weekday:"long",hour:"numeric",minute:"2-digit"})}catch(e){return ""}};
window.addEventListener("online",()=>{NET=true;syncBar();flush();if(VIEW==="student"&&SV.code)loadStudent(SV.code,false,true)});
window.addEventListener("offline",()=>{NET=false;syncBar()});
setInterval(()=>{if(OUTBOX.length)flush()},30000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")flush()});

async function loadTeacher(fromLogin){
  if(!fromLogin&&!TDB){const c=jget("halaqa-tdb",null);if(c){TDB=c;render()}else $("#view").innerHTML=loadingHTML()}
  try{
    if(OUTBOX.length){await flush();if(OUTBOX.length){if(!TDB)throw new Error("offline");return}}
    const d=await api("teacherData",PIN);NET=true;
    if(OUTBOX.length)return;
    TDB=d;cacheT();pref("halaqa-tsync",new Date().toISOString());if(VIEW==="teacher")render();
  }catch(err){
    if(fromLogin)throw err;
    if(isAuthErr(err)){PIN=null;pref("halaqa-pin",null);TDB=null;jset("halaqa-tdb",null);render();toast(errMsg(err));return}

const ALL=["","9999"];
function statsFor(sid,rng=ALL){
  const ss=DB.sessions.filter(s=>s.sid===sid&&s.date>=rng[0]&&s.date<=rng[1]);
  const o={new:0,minor:0,major:0,sessions:ss.length,days:0,present:0,late:0,absent:0,excused:0,points:0,ded:0,att:0,nw:0,rev:0,beh:0,part:0,bonus:0};
  ss.forEach(s=>{
    if(s.att!=="e")o.days++;
    o[{p:"present",l:"late",a:"absent",e:"excused"}[s.att]]++;
    for(const t in s.wards){const w=s.wards[t];if(w&&w.grade>0)o[t]+=ayahs(w)}
    const p=sesParts(s);PARTS.forEach(([k])=>o[k]+=p[k]);o.points+=p.total;
    o.ded+=(s.adab||0)+(s.uniform||0);o.bonus+=+s.bonus||0;
  });
  o.points=r1(o.points);o.avg=ss.length?r1(o.points/ss.length):0;
  o.attRate=o.days?Math.round((o.present+o.late)/o.days*100):0;
  return o;
}

function setRange(p,r){
  $("#"+p+"fs").value=r?r.from[0]:0;$("#"+p+"fa").value=r?r.from[1]:"";
  $("#"+p+"ts").value=r?r.to[0]:0;$("#"+p+"ta").value=r?r.to[1]:"";syncRange(p);
}
function readRange(p){
  const fs=+$("#"+p+"fs").value,ts=+$("#"+p+"ts").value;let fa=+$("#"+p+"fa").value,ta=+$("#"+p+"ta").value;
  if(!fs||!ts||!fa||!ta)return null;
  fa=Math.min(Math.max(1,fa),sLen(fs));ta=Math.min(Math.max(1,ta),sLen(ts));
  return{from:[fs,fa],to:[ts,ta]};
}
function syncRange(p,changedId){
  const fs=$("#"+p+"fs"),ts=$("#"+p+"ts"),fa=$("#"+p+"fa"),ta=$("#"+p+"ta");
  if(changedId===p+"fs"&&+fs.value){if(!fa.value)fa.value=1;if(!+ts.value){ts.value=fs.value;ta.value=sLen(fs.value)}}
  if(changedId===p+"ts"&&+ts.value&&!ta.value)ta.value=sLen(ts.value);
  if(+fs.value)fa.max=sLen(fs.value);if(+ts.value)ta.max=sLen(ts.value);
  const r=readRange(p);$("#"+p+"cnt").textContent=r?`${ayahs(r)} آية`:"";
}

function adminHTML(studs){
  const c=DB.circles.find(c=>c.id===T.cid);
  return `<section class="panel stack">
    ${c?`<h2 style="margin:0">طلاب «${esc(c.name)}»</h2>
    <div class="row"><div style="flex:1 1 200px"><label class="lbl" for="nsName">طالب جديد</label><input type="text" id="nsName" placeholder="اسم الطالب" style="width:100%"></div><button class="btn primary" id="addStudent">إضافة طالب</button></div>
    <div class="tbl-wrap"><table><thead><tr><th>الطالب</th><th>رمز الدخول</th><th></th></tr></thead><tbody>
    ${studs.map(s=>`<tr><td>${esc(s.name)}</td><td><span class="code">${s.code}</span></td><td style="text-align:left" id="rm-${s.id}"><button class="btn small" data-recode="${s.id}">رمز جديد</button> <button class="btn danger small" data-rmask="${s.id}">حذف</button></td></tr>`).join("")||`<tr><td colspan="3" class="muted">لا يوجد طلاب بعد.</td></tr>`}
    </tbody></table></div>
    <p class="muted" style="font-size:.8rem;margin:0">رمز الطالب من 6 حروف وأرقام إنجليزية، يدخله في صفحة الطالب. لا يهم إن كتبه بحروف صغيرة أو كبيرة.</p>`:""}
  </section>
  <section class="panel stack">
    <h2 style="margin:0">الحلقات</h2>
    ${c?`<div class="row"><div style="flex:1 1 200px"><label class="lbl" for="rcName">اسم الحلقة المختارة</label><input type="text" id="rcName" value="${esc(c.name)}" style="width:100%"></div><button class="btn" id="renCircle">حفظ الاسم</button>
      <span id="dcWrap">${studs.length?"":`<button class="btn danger" id="delCircleAsk">حذف هذه الحلقة</button>`}</span></div>`:""}
    <div class="row"><div style="flex:1 1 200px"><label class="lbl" for="ncName">حلقة جديدة</label><input type="text" id="ncName" placeholder="اسم الحلقة" style="width:100%"></div><button class="btn" id="addCircle">إضافة حلقة</button></div>
  </section>
  <section class="panel stack">
    <h2 style="margin:0">رمز دخول المعلم</h2>
    <div class="row"><div style="flex:1 1 200px"><label class="lbl" for="newPin">الرمز الجديد</label><input type="text" id="newPin" placeholder="4 أحرف أو أرقام على الأقل" style="width:100%"></div><button class="btn" id="setPin">تغيير الرمز</button></div>
  </section>`;
}

async function saveSession(){
  const st=TDB.students.find(s=>s.id===T.sid);if(!st)return;
  const att=document.querySelector('input[name=att]:checked').value;
  const wards={},next={};
  for(const [t,n] of TYPES){
    if($("#"+t+"on").checked&&(att==="p"||att==="l")){
      const r=readRange(t+"d");if(!r){toast(`أكمل نطاق ${n} أو ألغِ «سمّع»`);return}
      wards[t]={...r,grade:+$("#"+t+"g").value};
    }
    next[t]=readRange(t+"n");
  }
  const val=n=>+document.querySelector(`input[name=${n}]:checked`).value;
  const ses={id:uid(),sid:st.id,date:T.date,att,wards,adab:val("adab"),uniform:val("uniform"),part:val("part"),bonus:Math.max(0,+$("#bonus").value||0),note:$("#note").value.trim()};
  ses.points=sesPoints(ses);
  TDB.sessions=TDB.sessions.filter(s=>!(s.sid===st.id&&s.date===T.date));
  TDB.sessions.push(ses);st.next=next;DIRTY=false;
  queue("saveSession",ses,next);
  toast(`حُفظ ورد ${st.name}: ${ses.points} من 10`);
  const studs=studentsIn(T.cid);const doneSet=new Set(TDB.sessions.filter(s=>s.date===T.date).map(s=>s.sid));
  const i=studs.findIndex(s=>s.id===st.id);
  const nx=studs.slice(i+1).concat(studs.slice(0,i)).find(s=>!doneSet.has(s.id));
  if(nx)T.sid=nx.id;
  renderTeacher();window.scrollTo({top:0,behavior:"smooth"});
}

// ===== Student view =====
let SV={code:pref("halaqa-code")};
function renderStudent(){
  const st=SDB&&SDB.students.find(s=>s.id===SDB.me);
  if(!st){
    $("#view").innerHTML=`<section class="panel login stack"><img src="${LOGO}" alt="">
      <h2>صفحة الطالب</h2><p class="muted" style="margin:0">أدخل رمزك الذي أعطاك إياه المعلم</p>
      <form id="loginF" class="stack"><input id="codeIn" type="text" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="رمز الطالب" dir="ltr">
      <div class="err" id="loginErr"></div><button class="btn primary" type="submit">دخول</button></form></section>`;
    return;
  }
  const circle=DB.circles.find(c=>c.id===st.cid);const stt=statsFor(st.id);
  const rank=board(st.cid).findIndex(x=>x.s.id===st.id)+1;
  $("#view").innerHTML=`<div class="stack">
    <section class="panel"><div class="row between">
      <div><h2 style="margin:0;font-size:1.5rem">السلام عليكم يا ${esc(st.name)}</h2><span class="muted">${esc(circle?.name||"")} · ترتيبك ${rank} من ${studentsIn(st.cid).length}</span></div>
      <span class="row"><button class="btn small" id="sRefresh">تحديث</button><button class="btn small" id="logout">خروج</button></span></div></section>
    <section><h2>وردك القادم</h2><div class="next3">${TYPES.map(([t,n])=>{const r=st.next[t];return `<div class="nc" data-t="${t}"><div class="t">${n}</div><div class="r">${fmtRange(r)}</div><div class="muted" style="font-size:.82rem">${r?ayahs(r)+" آية":"لم يُحدَّد بعد"}</div></div>`}).join("")}</div></section>
    <div class="grid2">
      <section class="panel"><h2>لوحة الصدارة</h2>${boardHTML(st.cid,st.id)}</section>
      <aside class="stack"><section class="panel"><h2>ملخص إنجازك</h2>${statsHTML(stt)}</section>
      <section class="panel"><h2>سجل تسميعك</h2>${histHTML(st.id,false)}</section></aside>
    </div></div>`;
}

// ===== Routing & events =====
let VIEW=pref("halaqa-pin")?"teacher":"student";
function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===VIEW));
  DB=VIEW==="teacher"?TDB:SDB;
  VIEW==="teacher"?renderTeacher():renderStudent();
  syncBar();
}
const busy=(b,on)=>{if(b){b.disabled=on;b.style.opacity=on?.6:""}};
async function act(btn,fn){busy(btn,true);try{await fn()}catch(err){toast(errMsg(err))}finally{busy(btn,false)}}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const d=b.dataset;
  if(d.view){VIEW=d.view;render();if(VIEW==="teacher"&&!TDB&&PIN)loadTeacher();if(VIEW==="student"&&!SDB&&SV.code)loadStudent(SV.code);return}
  if(d.ttab){T.tab=d.ttab;pref("halaqa-ttab",T.tab);renderTeacher();return}
  if(d.sid){T.sid=d.sid;DIRTY=false;renderTeacher();return}
  if(d.goto){T.sid=d.goto;T.tab="rec";renderTeacher();return}
  if(d.edit){T.date=d.edit;renderTeacher();$("#form")?.scrollIntoView({behavior:"smooth"});return}
  if(d.bonus){const el=$("#bonus");el.value=Math.max(0,(+el.value||0)+(+d.bonus));DIRTY=true;return}
  if(d.same){const r=readRange(d.same+"d");if(r)setRange(d.same+"n",r);else toast("حدد ورد اليوم أولاً");return}
  if(d.recode){const s=TDB.students.find(x=>x.id===d.recode);s.code=newCode();queue("recode",s.id,s.code);toast(`رمز ${s.name} الجديد: ${s.code}`);renderTeacher();return}
  if(d.rmask){$("#rm-"+d.rmask).innerHTML=`<span class="confirm">حذف الطالب وسجله؟ <button class="btn danger small" data-rm="${d.rmask}">نعم</button><button class="btn small" data-cancel>لا</button></span>`;return}
  if(d.rm){TDB.students=TDB.students.filter(s=>s.id!==d.rm);TDB.sessions=TDB.sessions.filter(s=>s.sid!==d.rm);queue("removeStudent",d.rm);toast("تم حذف الطالب");renderTeacher();return}
  if("cancel" in d){render();return}
  switch(b.id){
    case "saveSes":saveSession();break;
    case "suggest":{const r=readRange("newd");const s=continueFrom(r);if(s)setRange("newn",s);else toast("حدد ورد الحفظ الجديد لليوم أولاً");break}
    case "delAsk":$("#delWrap").innerHTML=`<span class="confirm">تأكيد الحذف؟ <button class="btn danger small" id="delYes">نعم</button><button class="btn small" data-cancel>لا</button></span>`;break;
    case "delYes":TDB.sessions=TDB.sessions.filter(s=>!(s.sid===T.sid&&s.date===T.date));queue("deleteSession",T.sid,T.date);toast("تم حذف التسجيل");renderTeacher();break;
    case "renCircle":{const n=$("#rcName").value.trim();if(!n){toast("اكتب اسم الحلقة");break}TDB.circles.find(c=>c.id===T.cid).name=n;queue("renameCircle",T.cid,n);toast("تم تغيير اسم الحلقة");renderTeacher();break}
    case "delCircleAsk":$("#dcWrap").innerHTML=`<span class="confirm">حذف الحلقة؟ <button class="btn danger small" id="delCircleYes">نعم</button><button class="btn small" data-cancel>لا</button></span>`;break;
    case "delCircleYes":queue("deleteCircle",T.cid);TDB.circles=TDB.circles.filter(c=>c.id!==T.cid);T.cid=null;pref("halaqa-cid",null);toast("تم حذف الحلقة");renderTeacher();break;
    case "addCircle":{const n=$("#ncName").value.trim();if(!n){toast("اكتب اسم الحلقة");break}const c={id:uid(),name:n};TDB.circles.push(c);T.cid=c.id;pref("halaqa-cid",c.id);queue("addCircle",n,c.id);toast("تمت إضافة الحلقة");renderTeacher();break}
    case "addStudent":{const n=$("#nsName").value.trim();if(!n){toast("اكتب اسم الطالب");break}const s={id:uid(),cid:T.cid,name:n,code:newCode(),next:{}};TDB.students.push(s);queue("addStudent",T.cid,n,s.id,s.code);toast(`أضيف ${n} برمز ${s.code}`);renderTeacher();$("#nsName").focus();break}
    case "setPin":{const p=$("#newPin").value.trim();if(p.length<4){toast("الرمز 4 أحرف أو أرقام على الأقل");break}if(OUTBOX.length){toast("انتظر حتى تُرفع التسجيلات المحفوظة، ثم غيّر الرمز");break}act(b,async()=>{await api("setPin",PIN,p);PIN=p;pref("halaqa-pin",p);toast("تم تغيير رمز المعلم");renderTeacher()});break}
    case "tRefresh":loadTeacher();break;
    case "tLogout":if(OUTBOX.length){toast("يوجد تسجيلات لم تُرفع بعد. اتصل بالإنترنت أولاً حتى لا تضيع.");break}PIN=null;TDB=null;pref("halaqa-pin",null);jset("halaqa-tdb",null);VIEW="student";render();break;
    case "sRefresh":loadStudent(SV.code);break;
    case "logout":SV.code=null;SDB=null;pref("halaqa-code",null);jset("halaqa-sdb",null);render();break;
  }
});
document.addEventListener("change",e=>{
  const el=e.target;if(el.closest("#form"))DIRTY=true;
  if(el.id==="tc"){T.cid=el.value;pref("halaqa-cid",T.cid);T.sid=null;renderTeacher();return}
  if(el.id==="td"){T.date=el.value||today();renderTeacher();return}
  if(el.name==="period"){T.period=el.value;renderTeacher();return}
  if(el.dataset.rs){syncRange(el.dataset.rs,el.id);const rs=el.dataset.rs,tg=$("#"+rs.slice(0,-1)+"on");
    if(rs.endsWith("d")&&tg&&!tg.checked&&el.value&&el.value!=="0"){tg.checked=true;el.closest(".ward").classList.remove("off")}return}
  if(/^(new|minor|major)on$/.test(el.id)){el.closest(".ward").classList.toggle("off",!el.checked);return}
});
document.addEventListener("input",e=>{if(e.target.closest("#form"))DIRTY=true;if(e.target.dataset.rs)syncRange(e.target.dataset.rs,e.target.id)});
document.addEventListener("submit",async e=>{
  e.preventDefault();
  const btn=e.target.querySelector("button");
  if(e.target.id==="loginF"){
    const c=normCode($("#codeIn").value);if(!c)return;
    busy(btn,true);const ok=await loadStudent(c,true);if(!ok){busy(btn,false);$("#loginErr").textContent="الرمز غير صحيح. تأكد منه أو اطلبه من المعلم."}
  }
  if(e.target.id==="teachF"){
    const p=$("#pinIn").value.trim();if(!p)return;
    busy(btn,true);try{PIN=p;await loadTeacher(true);pref("halaqa-pin",p)}catch(err){PIN=null;busy(btn,false);$("#pinErr").textContent=errMsg(err)}
  }
});

if("serviceWorker" in navigator&&location.hostname.endsWith("github.io"))navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
if(VIEW==="teacher"&&PIN)loadTeacher();
if(VIEW==="student"&&SV.code)loadStudent(SV.code);
</script>
